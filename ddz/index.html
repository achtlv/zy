<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./static/media/icon64-4fb9fc.png" />
  <link rel="apple-touch-icon" href="./static/media/icon64-4fb9fc.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#386A20" />
  <meta name="description" content="斗地主，无广告纯净版，支持在线联机对战。无需下载，点开即玩！" />
  <meta name="color-scheme" content="light dark" />
  <!-- CDN 防盗链：无 Referer 时放行，故页面请求一律不带 Referer -->
  <meta name="referrer" content="no-referrer" />
  <title>斗地主</title>

  <!-- 字体：Roboto（带中文系统字体回退，离线也可用） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- 主题样式（完整替换原站样式） -->
  <link href="./static/css/main.280d4d20.css" rel="stylesheet" />

  <!-- 关键资源预加载 -->
  <link rel="preload" as="script" href="./static/js/474.edef6fdf.chunk.js" />
  <link rel="preload" as="script" href="./static/js/app.03832cca.chunk.js" />
  <link rel="preload" as="script" href="./static/js/ddz.1895f9e7.chunk.js" />
  <link rel="preload" as="image" href="./static/media/logo-4fb9fc.svg" />
</head>
<body>
  <!-- gid 预热：后台向 Worker 申请 gid 并种 cookie，建房时无需等待（消除建房白屏） -->
  <img src="/__gid" width="1" height="1" alt="" style="position:absolute;opacity:0;pointer-events:none" />

  <!-- 进入房间加载层：建房/进房到牌桌渲染完成前显示，避免白屏 -->
  <div id="room-loading">
    <div class="rl-card">
      <div class="rl-spin"></div>
      <div class="rl-text">进入房间中…</div>
    </div>
  </div>

  <div id="root">
    <!-- 加载动画（React 挂载后自动被替换） -->
    <div class="m3-splash" id="m3-splash">
      <img class="splash-logo" src="./static/media/logo-4fb9fc.svg" alt="斗地主" />
      <div class="splash-title">斗地主</div>
      <div class="splash-bar"></div>
      <div class="splash-sub">加载中…</div>
    </div>
  </div>

  <!-- 入口：原站应用（n.p 已指向本地 ./static/） -->
  <script defer="defer" src="./static/js/main.5f798aa7.js"></script>

  <script>
    // 兜底：即使 React 未及时替换，也优雅淡出加载动画
    window.addEventListener('load', function () {
      setTimeout(function () {
        var s = document.getElementById('m3-splash');
        if (s) { s.classList.add('done'); setTimeout(function () { s.remove(); }, 500); }
      }, 6000);
    });

    // 进入房间加载层：路径为 /{房间号} 且牌桌尚未渲染时显示，渲染完成或超时后隐藏
    (function () {
      var el = document.getElementById('room-loading');
      if (!el) return;
      var timer = null;
      function hide() { el.classList.remove('show'); if (timer) { clearTimeout(timer); timer = null; } }
      function upd() {
        var isRoom = /^\/[a-z0-9]{3,8}/.test(location.pathname);
        var ready = !!document.getElementById('userseat0');
        if (isRoom && !ready) {
          el.classList.add('show');
          if (!timer) timer = setTimeout(hide, 12000);
        } else {
          hide();
        }
      }
      window.addEventListener('popstate', upd);
      new MutationObserver(upd).observe(document.body, { childList: true, subtree: true });
      upd();
    })();
  </script>
</body>
</html>
