<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./static/media/icon64-4fb9fc.png" />
  <link rel="apple-touch-icon" href="./static/media/icon64-4fb9fc.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#386A20" />
  <meta name="description" content="斗地主，无广告纯净版，支持在线联机对战。无需下载，点开即玩！" />
  <meta name="color-scheme" content="light dark" />
  <!-- CDN 防盗链：无 Referer 时放行，故页面请求一律不带 Referer -->
  <meta name="referrer" content="no-referrer" />
  <title>斗地主</title>

  <!-- 字体：Roboto（带中文系统字体回退，离线也可用） -->
  <link rel="preconnect" href="https://fonts.font.im" />
  <link rel="preconnect" href="https://fonts.gstatic.font.im" crossorigin />
  <!-- 字体镜像站(fonts.font.im)异步加载：不可达时不影响页面渲染（用系统字体回退） -->
  <link href="https://fonts.font.im/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- 主题样式（完整替换原站样式） -->
  <link href="./static/css/main.280d4d20.v2.css" rel="stylesheet" />

  <!-- 关键资源预加载 -->
  <link rel="preload" as="script" href="./static/js/474.edef6fdf.chunk.js" />
  <link rel="preload" as="script" href="./static/js/app.03832cca.v2.chunk.js" />
  <link rel="preload" as="script" href="./static/js/ddz.1895f9e7.v2.chunk.js" />
  <link rel="preload" as="image" href="./static/media/logo-4fb9fc.svg" />
</head>
<body>
  <!-- gid 预热：后台向 Worker 申请 gid 并种 cookie，建房时无需等待（消除建房白屏） -->
  <img src="/__gid" width="1" height="1" alt="" style="position:absolute;opacity:0;pointer-events:none" />

  <!-- 进入房间加载层：建房/进房到牌桌渲染完成前显示，进度条 + 当前原因 -->
  <div id="room-loading">
    <div class="rl-card">
      <div class="rl-text" id="rl-reason">正在加载房间…</div>
      <div class="rl-bar"><div class="rl-bar-fill" id="rl-fill"></div></div>
      <div class="rl-sub" id="rl-sub">首次进入需连接服务器，请稍候</div>
    </div>
  </div>

  <div id="root">
    <!-- 加载动画（React 挂载后自动被替换） -->
    <div class="m3-splash" id="m3-splash">
      <img class="splash-logo" src="./static/media/logo-4fb9fc.svg" alt="斗地主" />
      <div class="splash-title">斗地主</div>
      <div class="splash-bar"></div>
      <div class="splash-sub">加载中…</div>
    </div>
  </div>

  <!-- 入口：原站应用（n.p 已指向本地 ./static/） -->
  <script defer="defer" src="./static/js/main.5f798aa7.v2.js"></script>

  <script>
    // 兜底：即使 React 未及时替换，也优雅淡出加载动画
    window.addEventListener('load', function () {
      setTimeout(function () {
        var s = document.getElementById('m3-splash');
        if (s) { s.classList.add('done'); setTimeout(function () { s.remove(); }, 500); }
      }, 6000);
    });

    // 进入房间加载层：路径为 /{房间号} 且牌桌尚未渲染时显示。
    // 进度条按真实阶段推进：加载房间 → 连接服务器 → 同步房间数据 → 完成。
    // 注意：避免 innerText（强制布局）与高频回调，防止干扰对局渲染。
    (function () {
      var el = document.getElementById('room-loading');
      if (!el) return;
      var fill = document.getElementById('rl-fill');
      var reason = document.getElementById('rl-reason');
      var timer = null, stage = 0, pending = false;
      function setProgress(p, text, sub) {
        if (p > stage) { stage = p; if (fill) fill.style.width = stage + '%'; }
        if (text && reason) reason.textContent = text;
        var s = document.getElementById('rl-sub');
        if (sub && s) s.textContent = sub;
      }
      function hide() {
        el.classList.remove('show');
        if (timer) { clearTimeout(timer); timer = null; }
        setTimeout(function () { stage = 0; }, 400);
      }
      function upd() {
        if (pending) return;
        pending = true;
        setTimeout(function () {
          pending = false;
          try {
            var isRoom = /^\/[a-z0-9]{3,8}/.test(location.pathname);
            if (!isRoom) { el.classList.remove('show'); return; }
            if (document.getElementById('userseat0')) { hide(); return; }
            el.classList.add('show');
            if (stage < 25) setProgress(18, '正在加载房间…', '正在获取房间配置');
            if (document.body.textContent.indexOf('房间号') >= 0 && stage < 70) setProgress(62, '正在连接服务器…', '正在建立游戏连接');
            if (!timer) timer = setTimeout(hide, 12000);
          } catch (e) { /* 忽略异常，绝不阻塞页面 */ }
        }, 100);
      }
      window.addEventListener('popstate', upd);
      new MutationObserver(upd).observe(document.body, { childList: true, subtree: true });
      upd();
    })();  </script>
</body>
</html>
